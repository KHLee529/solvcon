name: release

# Build, package, and unbox-test the release artifacts. A pushed version tag
# runs the whole pipeline and drafts a GitHub release from it; a manual run
# exercises the same stages on any ref without publishing anything.
#
# The stage logic lives in contrib/ci/release.sh so it can be rerun by hand.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build (default: the run ref)'
        default: ''
      version:
        description: 'Version that names the artifacts (default: short hash)'
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  build:

    name: build_package_${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: ${{ fromJSON(vars.SCGH_TIMEOUT_RELEASE || '90') }}

    strategy:
      matrix:
        # Add a platform here together with its branch in release.sh.
        include:
          - os: macos-26

      fail-fast: false

    env:
      # A tag push names the artifacts after the tag; a manual run takes the
      # version input and leaves the short hash as the fallback.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      DIST_DIR: dist

    steps:

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: setup
        run: contrib/ci/release.sh setup

      - name: build
        run: contrib/ci/release.sh build

      - name: package
        run: contrib/ci/release.sh package

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  unbox_test:

    # Install nothing beyond the runner image, so the test sees the artifact
    # the way a user's clean machine would and catches a missing dependency
    # that the build host happened to provide.
    needs: [build]

    name: unbox_test_${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - os: macos-26

      fail-fast: false

    steps:

      # The test needs the Makefile and the scripts it runs only. Cone mode
      # matches directories, not files, hence off.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: |
            Makefile
            contrib/ci/release.sh
            contrib/bundle/bundle-with-devenv.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.os }}
          path: dist/

      - name: unbox test
        run: |
          for dmg in dist/*.dmg; do
            contrib/ci/release.sh unbox "$dmg"
          done

  publish:

    # Only a tag push publishes, and only as a draft, so a maintainer reviews
    # the notes and the assets before the release becomes public.
    needs: [unbox_test]

    if: github.ref_type == 'tag'

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    permissions:
      contents: write

    steps:

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --draft --verify-tag --generate-notes \
            --title "${{ github.ref_name }}"
